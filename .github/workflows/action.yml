name: Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # TEMPORARY: the 0.9.0 fix (process.exitCode instead of process.exit in
  # src/cli/index.ts) did not resolve the ubuntu/macos failures below even
  # after 0.9.0 was confirmed live as `latest` on the registry. The
  # previous version of this job tested `--version`, which turned out to
  # be a bad test: npx itself likely intercepts a bare --version/-v for
  # its own version rather than forwarding it to the wrapped package,
  # which would also produce no output for an unrelated reason. This
  # tests the actual `scan` command instead, with the version pinned
  # explicitly to 0.9.0 (not `latest`), retried 3 times in a loop to
  # check whether this is at all intermittent rather than deterministic.
  debug-version:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Create a clean fixture file
        shell: bash
        run: echo "const greeting = 'hello world'" > clean.js

      - name: Run the real scan command against 0.9.0 pinned explicitly, 3 times
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "=== attempt $i ==="
            npx --yes unicode-shield@0.9.0 scan clean.js --json > "out-$i.txt" 2> "err-$i.txt"
            echo "exit code: $?"
            echo "--- stdout (byte count: $(wc -c < "out-$i.txt")) ---"
            cat "out-$i.txt"
            echo "--- stderr (byte count: $(wc -c < "err-$i.txt")) ---"
            cat "err-$i.txt"
          done

  # Uses the action.yml/action/annotate.mjs checked out at this exact commit
  # (uses: ./), not a fixed published version, so a regression in the
  # action's own code is what this actually catches. Matrixed across all
  # three hosted-runner OSes since annotate.mjs shells out to npx, which
  # needed a Windows-specific fix (a plain execFileSync('npx', ...) can't
  # resolve the extensionless POSIX script Windows ships; only npx.cmd
  # works there), confirmed directly rather than assumed to work.
  clean-scan:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # A dedicated fixture, not this repo's own `src`: src/__tests__
      # deliberately contains real bidi/invisible characters as literal
      # test fixture data (that's the only way to test that scan()
      # actually detects them), so scanning src itself was never going to
      # be clean and would break again the moment any such fixture
      # changes. threat-scan/threat-scan-non-failing below already use
      # this same pattern (a purpose-built file) rather than the real
      # source tree, for the same reason.
      - name: Create a clean fixture file (no dangerous Unicode)
        shell: bash
        run: echo "const greeting = 'hello world'" > clean.js

      - name: Scan the clean fixture file (expected clean)
        uses: ./
        with:
          path: clean.js

  threat-scan:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # shell: bash is explicit: run: steps default to pwsh on Windows
      # runners, which doesn't understand this heredoc syntax. A relative
      # path, not /tmp, since that's not a real filesystem root on Windows.
      - name: Create a file with a real Unicode threat
        shell: bash
        run: |
          node <<'EOF'
          const fs = require('node:fs')
          const rlo = String.fromCodePoint(0x202e)
          fs.writeFileSync('threat.js', `const username = "admin${rlo}nimda"\n`)
          EOF

      - name: Scan the threat file (expected to fail)
        id: scan
        uses: ./
        continue-on-error: true
        with:
          path: threat.js

      - name: Verify the action correctly reported and failed on the threat
        shell: bash
        run: |
          if [ "${{ steps.scan.outputs.safe }}" != "false" ]; then
            echo "Expected outputs.safe=false, got '${{ steps.scan.outputs.safe }}'"
            exit 1
          fi
          if [ "${{ steps.scan.outputs['threat-count'] }}" != "1" ]; then
            echo "Expected outputs.threat-count=1, got '${{ steps.scan.outputs['threat-count'] }}'"
            exit 1
          fi
          if [ "${{ steps.scan.outcome }}" != "failure" ]; then
            echo "Expected the scan step to fail (dangerous threat, fail-on-threat defaults true), got outcome '${{ steps.scan.outcome }}'"
            exit 1
          fi

  threat-scan-non-failing:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Create a file with a real Unicode threat
        shell: bash
        run: |
          node <<'EOF'
          const fs = require('node:fs')
          const rlo = String.fromCodePoint(0x202e)
          fs.writeFileSync('threat.js', `const username = "admin${rlo}nimda"\n`)
          EOF

      - name: Scan with fail-on-threat disabled (expected to succeed)
        id: scan
        uses: ./
        with:
          path: threat.js
          fail-on-threat: 'false'

      - name: Verify the step still reported the threat without failing
        shell: bash
        run: |
          if [ "${{ steps.scan.outputs.safe }}" != "false" ]; then
            echo "Expected outputs.safe=false, got '${{ steps.scan.outputs.safe }}'"
            exit 1
          fi

  sarif-scan:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Only this job needs security-events: write (for upload-sarif), see
    # action.yml's own comment on why that permission stays scoped to the
    # one step that actually needs it rather than requested by default. A
    # fork-submitted pull_request run gets a read-only token regardless of
    # what's requested here, a GitHub guarantee, not something this
    # workflow file can accidentally weaken.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Create a file with a real Unicode threat
        shell: bash
        run: |
          node <<'EOF'
          const fs = require('node:fs')
          const rlo = String.fromCodePoint(0x202e)
          fs.writeFileSync('threat.js', `const username = "admin${rlo}nimda"\n`)
          EOF

      - name: Scan with sarif enabled
        id: scan
        uses: ./
        with:
          path: threat.js
          fail-on-threat: 'false'
          sarif: 'true'
          # Distinct per matrix leg: this job runs the action 3 times
          # against the same commit (once per OS), and an upload-sarif
          # call with no category tracks all of them as the same series,
          # each one silently replacing the last in the Security tab
          # instead of being tracked separately, confirmed against
          # upload-sarif's own documented behavior for repeat calls.
          category: unicode-shield-self-test-${{ matrix.os }}

      - name: Verify a real, valid SARIF file was produced and uploadable
        shell: bash
        env:
          SARIF_PATH: ${{ steps.scan.outputs['sarif-path'] }}
        run: |
          if [ -z "$SARIF_PATH" ]; then
            echo "Expected outputs.sarif-path to be set"
            exit 1
          fi
          node <<'EOF'
          const fs = require('node:fs')
          const log = JSON.parse(fs.readFileSync(process.env.SARIF_PATH, 'utf8'))
          if (log.version !== '2.1.0') throw new Error(`expected SARIF version 2.1.0, got ${log.version}`)
          const results = log.runs[0].results
          if (results.length !== 1) throw new Error(`expected exactly 1 SARIF result, got ${results.length}`)
          if (results[0].ruleId !== 'bidi-embedding') throw new Error(`expected ruleId bidi-embedding, got ${JSON.stringify(results[0].ruleId)}`)
          console.log('SARIF file verified:', process.env.SARIF_PATH)
          EOF
