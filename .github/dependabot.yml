version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Dependabot's own PR titles aren't Conventional-Commits-shaped by
    # default ("Bump x from 1 to 2"), which pr-title-lint.yml rejects and
    # release-please can't classify. "chore" also means these bumps don't
    # trigger a release on their own - they ride along with whatever
    # feat:/fix: work ships next, which is the right default for routine
    # dependency bumps with no behavior change of their own.
    commit-message:
      prefix: "chore"
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
